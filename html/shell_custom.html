<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Bullet Hell</title>
    <style>
        /* Dark theme, removes scrollbars, and blocks standard browser drag behaviors */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; 
        }

        /* Dynamically fits the container window while preserving your Raylib aspect ratio */
        canvas {
            border: none;
            outline: none;
            background-color: #000000;
            display: block;
            image-rendering: pixelated; /* Keeps 2D pixel-art crisp if it stretches */
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var Module = {
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };
    </script>
    
    {{{ SCRIPT }}}
</body>
</html>
